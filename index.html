<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>OVERDRIVE</title>

    <link rel="stylesheet" href="style.css">

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js"
        }
    }
    </script>
</head>

<body>

<div id="game"></div>

<div id="crosshair"></div>
<div id="hitmarker"></div>
<div id="damageFlash"></div>
<div id="vignette"></div>

<div id="hud">

    <div id="health">100</div>
    <div id="healthLabel">INTEGRITY</div>

    <div id="staminaContainer">
        <div id="staminaBar"></div>
    </div>

    <div id="ammo">12 / 60</div>

    <div id="weaponName">
        REVOLVER
    </div>

    <div id="kills">
        KILLS: 0
    </div>

</div>


<div id="startScreen">

    <h1>OVERDRIVE</h1>

    <div class="subtitle">
        COMBAT SYSTEM ONLINE
    </div>

    <div class="clickText">
        CLICK TO ENTER
    </div>

    <div class="controlsText">
        WASD · MOUSE · SPACE · SHIFT · Q · 1 2 3 · R
    </div>

</div>


<div id="pauseScreen">

    <h2>PAUSED</h2>

    <p>CLICK TO RETURN</p>

</div>


<div id="deathScreen">

    <h2>SYSTEM FAILURE</h2>

    <p>CLICK TO RESTART</p>

</div>


<script type="module" src="game.js"></script>

</body>
</html>
