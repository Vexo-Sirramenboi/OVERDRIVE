<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OVERDRIVE</title>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js"
    }
}
</script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030307;
    font-family: Arial, Helvetica, sans-serif;
    user-select: none;
}

#game {
    position: fixed;
    inset: 0;
}

canvas {
    display: block;
}


/* =========================================
   CROSSHAIR
========================================= */

#crosshair {
    position: fixed;
    left: 50%;
    top: 50%;

    width: 24px;
    height: 24px;

    transform: translate(-50%, -50%);

    z-index: 20;
    pointer-events: none;
}

#crosshair::before,
#crosshair::after {
    content: "";

    position: absolute;

    background: white;

    box-shadow:
        0 0 5px #00ffff,
        0 0 14px #00ffff;
}

#crosshair::before {
    width: 2px;
    height: 24px;

    left: 11px;
    top: 0;
}

#crosshair::after {
    width: 24px;
    height: 2px;

    left: 0;
    top: 11px;
}


/* =========================================
   HIT MARKER
========================================= */

#hitmarker {
    position: fixed;

    left: 50%;
    top: 50%;

    width: 25px;
    height: 25px;

    transform:
        translate(-50%, -50%)
        scale(0);

    opacity: 0;

    z-index: 21;

    pointer-events: none;

    transition:
        transform 0.08s,
        opacity 0.15s;
}

#hitmarker::before,
#hitmarker::after {
    content: "";

    position: absolute;

    width: 22px;
    height: 2px;

    background: white;

    box-shadow:
        0 0 8px white;
}

#hitmarker::before {
    transform: rotate(45deg);

    left: 1px;
    top: 11px;
}

#hitmarker::after {
    transform: rotate(-45deg);

    left: 1px;
    top: 11px;
}


/* =========================================
   HUD
========================================= */

#hud {
    position: fixed;

    left: 25px;
    bottom: 25px;

    z-index: 20;

    color: white;

    pointer-events: none;
}

#health {
    font-size: 38px;

    font-weight: 1000;

    color: #ff3155;

    text-shadow:
        0 0 8px #ff3155,
        0 0 20px #ff003c;
}

#healthLabel {
    color: #999;

    font-size: 10px;

    letter-spacing: 4px;
}

#staminaContainer {
    width: 220px;
    height: 8px;

    margin-top: 12px;

    background: #15151b;

    border: 1px solid #444;
}

#staminaBar {
    width: 100%;
    height: 100%;

    background: #00eaff;

    box-shadow:
        0 0 8px #00eaff,
        0 0 20px #00eaff;
}

#kills {
    margin-top: 15px;

    font-size: 15px;

    letter-spacing: 3px;

    color: white;
}


/* =========================================
   WEAPON
========================================= */

#weapon {
    position: fixed;

    left: 50%;
    bottom: -35px;

    width: 330px;
    height: 230px;

    transform:
        translateX(-50%)
        rotate(-3deg);

    z-index: 15;

    pointer-events: none;
}

.gunBody {
    position: absolute;

    width: 180px;
    height: 75px;

    right: 40px;
    bottom: 60px;

    background:
        linear-gradient(
            135deg,
            #292934,
            #09090d
        );

    border:
        2px solid #555;

    box-shadow:
        0 0 15px rgba(0,255,255,0.2);

    transform:
        skew(-8deg);
}

.gunBarrel {
    position: absolute;

    width: 150px;
    height: 22px;

    right: 175px;
    bottom: 104px;

    background:
        linear-gradient(
            180deg,
            #333,
            #080808
        );

    border:
        2px solid #555;

    transform:
        skew(-4deg);
}

.gunBarrel2 {
    position: absolute;

    width: 150px;
    height: 22px;

    right: 175px;
    bottom: 82px;

    background:
        linear-gradient(
            180deg,
            #333,
            #080808
        );

    border:
        2px solid #555;

    transform:
        skew(-4deg);
}

.gunGlow {
    position: absolute;

    width: 65px;
    height: 5px;

    right: 72px;
    bottom: 110px;

    background: #00ffff;

    box-shadow:
        0 0 10px #00ffff,
        0 0 25px #00ffff;
}

.gunGrip {
    position: absolute;

    width: 60px;
    height: 105px;

    right: 85px;
    bottom: -5px;

    background:
        linear-gradient(
            90deg,
            #111,
            #292930
        );

    border:
        2px solid #555;

    transform:
        rotate(13deg);
}


/* =========================================
   START SCREEN
========================================= */

#startScreen {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    background:
        radial-gradient(
            circle,
            rgba(0,100,140,0.14),
            rgba(0,0,0,0.96) 70%
        );
}

#title {
    margin: 0;

    color: white;

    font-size:
        clamp(55px, 10vw, 130px);

    font-weight: 1000;

    letter-spacing: 18px;

    text-shadow:
        0 0 10px #00ffff,
        0 0 35px #0088ff,
        0 0 80px #0066ff;
}

#subtitle {
    margin-top: 10px;

    color: #00eaff;

    letter-spacing: 7px;

    font-size: 13px;
}

#clickText {
    margin-top: 55px;

    color: white;

    letter-spacing: 5px;

    animation:
        pulse 1.1s infinite alternate;
}

@keyframes pulse {

    from {
        opacity: 0.3;
    }

    to {
        opacity: 1;
    }

}


/* =========================================
   PAUSE
========================================= */

#pauseScreen,
#deathScreen {

    position: fixed;

    inset: 0;

    z-index: 90;

    display: none;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    background:
        rgba(0,0,0,0.7);

    backdrop-filter:
        blur(5px);

    color: white;

    text-align: center;

}

#pauseScreen h2,
#deathScreen h2 {

    margin: 0;

    font-size: 55px;

    letter-spacing: 10px;

}

#pauseScreen p,
#deathScreen p {

    color: #999;

    letter-spacing: 3px;

}


/* =========================================
   DAMAGE FLASH
========================================= */

#damageFlash {

    position: fixed;

    inset: 0;

    z-index: 80;

    pointer-events: none;

    background:
        rgba(255,0,0,0);

}


/* =========================================
   VIGNETTE
========================================= */

#vignette {

    position: fixed;

    inset: 0;

    z-index: 5;

    pointer-events: none;

    background:
        radial-gradient(
            circle,
            transparent 45%,
            rgba(0,0,0,0.6) 100%
        );

}

</style>
</head>

<body>

<div id="game"></div>

<div id="crosshair"></div>

<div id="hitmarker"></div>

<div id="vignette"></div>

<div id="damageFlash"></div>


<div id="hud">

    <div id="health">
        100
    </div>

    <div id="healthLabel">
        INTEGRITY
    </div>

    <div id="staminaContainer">
        <div id="staminaBar"></div>
    </div>

    <div id="kills">
        KILLS: 0
    </div>

</div>


<div id="weapon">

    <div class="gunBody"></div>

    <div class="gunBarrel"></div>

    <div class="gunBarrel2"></div>

    <div class="gunGlow"></div>

    <div class="gunGrip"></div>

</div>


<div id="startScreen">

    <h1 id="title">
        OVERDRIVE
    </h1>

    <div id="subtitle">
        COMBAT SYSTEM ONLINE
    </div>

    <div id="clickText">
        CLICK TO ENTER
    </div>

</div>


<div id="pauseScreen">

    <h2>
        PAUSED
    </h2>

    <p>
        CLICK TO RETURN
    </p>

</div>


<div id="deathScreen">

    <h2>
        SYSTEM FAILURE
    </h2>

    <p>
        CLICK TO RESTART
    </p>

</div>


<script type="module">

import * as THREE from "three";

import {
    PointerLockControls
} from "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/controls/PointerLockControls.js";


// ============================================================
// SCENE
// ============================================================

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x040408
    );

scene.fog =
    new THREE.FogExp2(
        0x040408,
        0.024
    );


// ============================================================
// CAMERA
// ============================================================

const camera =
    new THREE.PerspectiveCamera(
        90,
        window.innerWidth /
        window.innerHeight,
        0.05,
        500
    );

camera.position.set(
    0,
    2,
    15
);


// ============================================================
// RENDERER
// ============================================================

const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        powerPreference:
            "high-performance"
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled =
    true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document
    .getElementById("game")
    .appendChild(
        renderer.domElement
    );


// ============================================================
// POINTER LOCK
// ============================================================

const controls =
    new PointerLockControls(
        camera,
        document.body
    );


// ============================================================
// LIGHTING
// ============================================================

const ambient =
    new THREE.HemisphereLight(
        0x6688ff,
        0x080808,
        1.5
    );

scene.add(
    ambient
);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sun.position.set(
    10,
    25,
    10
);

sun.castShadow =
    true;

sun.shadow.mapSize.width =
    2048;

sun.shadow.mapSize.height =
    2048;

scene.add(
    sun
);


// ============================================================
// FLOOR
// ============================================================

const floor =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            80,
            1,
            80
        ),

        new THREE.MeshStandardMaterial({
            color: 0x101018,
            roughness: 0.6,
            metalness: 0.5
        })

    );


floor.position.y =
    -0.5;

floor.receiveShadow =
    true;

scene.add(
    floor
);


// ============================================================
// COLLISION OBJECTS
// ============================================================

const collisionObjects = [];


// ============================================================
// WALLS
// ============================================================

function createWall(
    x,
    y,
    z,
    width,
    height,
    depth
) {

    const wall =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),

            new THREE.MeshStandardMaterial({
                color: 0x151520,
                roughness: 0.45,
                metalness: 0.75
            })

        );


    wall.position.set(
        x,
        y,
        z
    );


    wall.castShadow =
        true;

    wall.receiveShadow =
        true;


    scene.add(
        wall
    );


    collisionObjects.push(
        wall
    );


    return wall;
}


createWall(
    0,
    5,
    -40,
    80,
    10,
    2
);

createWall(
    0,
    5,
    40,
    80,
    10,
    2
);

createWall(
    -40,
    5,
    0,
    2,
    10,
    80
);

createWall(
    40,
    5,
    0,
    2,
    10,
    80
);


// ============================================================
// ARENA BLOCKS
// ============================================================

function createBlock(
    x,
    y,
    z,
    width,
    height,
    depth,
    color = 0x202030
) {

    const block =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),

            new THREE.MeshStandardMaterial({
                color,
                roughness: 0.35,
                metalness: 0.8
            })

        );


    block.position.set(
        x,
        y,
        z
    );


    block.castShadow =
        true;

    block.receiveShadow =
        true;


    scene.add(
        block
    );


    collisionObjects.push(
        block
    );


    return block;
}


createBlock(
    -13,
    3,
    -10,
    8,
    6,
    8
);

createBlock(
    13,
    3,
    -14,
    8,
    6,
    8
);

createBlock(
    -15,
    2,
    13,
    10,
    4,
    6
);

createBlock(
    15,
    4,
    14,
    8,
    8,
    8
);


// ============================================================
// GRID
// ============================================================

const grid =
    new THREE.GridHelper(
        80,
        80,
        0x00ffff,
        0x202030
    );

grid.position.y =
    0.01;

scene.add(
    grid
);


// ============================================================
// NEON LIGHTS
// ============================================================

function neon(
    x,
    y,
    z,
    color
) {

    const light =
        new THREE.PointLight(
            color,
            25,
            30
        );


    light.position.set(
        x,
        y,
        z
    );


    scene.add(
        light
    );


    const orb =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                0.18,
                16,
                16
            ),

            new THREE.MeshBasicMaterial({
                color
            })

        );


    orb.position.copy(
        light.position
    );


    scene.add(
        orb
    );
}


neon(
    -20,
    5,
    -20,
    0x00ffff
);

neon(
    20,
    5,
    -20,
    0xff0066
);

neon(
    -20,
    5,
    20,
    0x6633ff
);

neon(
    20,
    5,
    20,
    0x00ffff
);


// ============================================================
// PLAYER
// ============================================================

const player = {

    height: 2,

    velocity:
        new THREE.Vector3(),

    groundSpeed: 22,

    sprintSpeed: 34,

    jumpPower: 12,

    dashPower: 48,

    health: 100,

    stamina: 100,

    grounded: true,

    canDash: true,

    dashCooldown: false,

    bobTime: 0,

    alive: true

};


camera.position.y =
    player.height;


// ============================================================
// INPUT
// ============================================================

const keys = {};


document.addEventListener(
    "keydown",
    event => {

        keys[event.code] =
            true;


        if (
            event.code === "Space" &&
            player.grounded &&
            player.alive
        ) {

            player.velocity.y =
                player.jumpPower;

            player.grounded =
                false;
        }


        if (
            event.code === "KeyQ"
        ) {

            dash();
        }

    }
);


document.addEventListener(
    "keyup",
    event => {

        keys[event.code] =
            false;
    }
);


// ============================================================
// START / PAUSE
// ============================================================

const startScreen =
    document.getElementById(
        "startScreen"
    );

const pauseScreen =
    document.getElementById(
        "pauseScreen"
    );

const deathScreen =
    document.getElementById(
        "deathScreen"
    );


startScreen.addEventListener(
    "click",
    () => {

        if (
            player.alive
        ) {

            controls.lock();

        }

    }
);


pauseScreen.addEventListener(
    "click",
    () => {

        controls.lock();

    }
);


deathScreen.addEventListener(
    "click",
    () => {

        location.reload();

    }
);


controls.addEventListener(
    "lock",
    () => {

        startScreen.style.display =
            "none";

        pauseScreen.style.display =
            "none";

    }
);


controls.addEventListener(
    "unlock",
    () => {

        if (
            player.alive
        ) {

            pauseScreen.style.display =
                "flex";

        }

    }
);


// ============================================================
// DASH
// ============================================================

function dash() {

    if (
        !controls.isLocked ||
        !player.canDash ||
        player.dashCooldown ||
        !player.alive
    ) {

        return;
    }


    const direction =
        new THREE.Vector3();


    camera.getWorldDirection(
        direction
    );


    direction.y = 0;

    direction.normalize();


    player.velocity.addScaledVector(
        direction,
        player.dashPower
    );


    player.canDash =
        false;

    player.dashCooldown =
        true;


    setTimeout(
        () => {

            player.canDash =
                true;

        },
        600
    );


    setTimeout(
        () => {

            player.dashCooldown =
                false;

        },
        200
    );
}


// ============================================================
// MOVEMENT
// ============================================================

const clock =
    new THREE.Clock();


function moveToward(
    current,
    target,
    maxDelta
) {

    if (
        Math.abs(
            target - current
        ) <= maxDelta
    ) {

        return target;
    }


    return current +
        Math.sign(
            target - current
        ) *
        maxDelta;
}


function updatePlayer(
    delta
) {

    if (
        !player.alive
    ) {

        return;
    }


    let forward = 0;
    let right = 0;


    if (
        keys["KeyW"]
    ) {

        forward += 1;
    }


    if (
        keys["KeyS"]
    ) {

        forward -= 1;
    }


    if (
        keys["KeyD"]
    ) {

        right += 1;
    }


    if (
        keys["KeyA"]
    ) {

        right -= 1;
    }


    const moving =
        forward !== 0 ||
        right !== 0;


    const sprinting =
        (
            keys["ShiftLeft"] ||
            keys["ShiftRight"]
        ) &&
        moving &&
        player.stamina > 0;


    const targetSpeed =
        sprinting
            ? player.sprintSpeed
            : player.groundSpeed;


    // STAMINA

    if (
        sprinting
    ) {

        player.stamina -=
            35 * delta;

    } else {

        player.stamina +=
            28 * delta;

    }


    player.stamina =
        THREE.MathUtils.clamp(
            player.stamina,
            0,
            100
        );


    // CAMERA FORWARD

    const forwardVector =
        new THREE.Vector3();


    camera.getWorldDirection(
        forwardVector
    );


    forwardVector.y = 0;

    forwardVector.normalize();


    // CORRECT RIGHT VECTOR

    const rightVector =
        new THREE.Vector3(
            -forwardVector.z,
            0,
            forwardVector.x
        );


    // DESIRED DIRECTION

    const desired =
        new THREE.Vector3();


    desired.addScaledVector(
        forwardVector,
        forward
    );


    desired.addScaledVector(
        rightVector,
        right
    );


    if (
        desired.lengthSq() > 0
    ) {

        desired.normalize();

    }


    // ACCELERATION

    const acceleration =
        player.grounded
            ? 120
            : 45;


    if (
        moving
    ) {

        player.velocity.x =
            moveToward(
                player.velocity.x,
                desired.x *
                    targetSpeed,
                acceleration *
                    delta
            );


        player.velocity.z =
            moveToward(
                player.velocity.z,
                desired.z *
                    targetSpeed,
                acceleration *
                    delta
            );

    } else if (
        player.grounded
    ) {

        player.velocity.x =
            moveToward(
                player.velocity.x,
                0,
                100 * delta
            );


        player.velocity.z =
            moveToward(
                player.velocity.z,
                0,
                100 * delta
            );

    }


    // GRAVITY

    player.velocity.y -=
        32 * delta;


    // POSITION

    camera.position.x +=
        player.velocity.x *
        delta;

    camera.position.y +=
        player.velocity.y *
        delta;

    camera.position.z +=
        player.velocity.z *
        delta;


    // GROUND

    if (
        camera.position.y <=
        player.height
    ) {

        camera.position.y =
            player.height;

        player.velocity.y =
            0;

        player.grounded =
            true;

    } else {

        player.grounded =
            false;

    }


    // ARENA BOUNDARIES

    camera.position.x =
        THREE.MathUtils.clamp(
            camera.position.x,
            -37,
            37
        );

    camera.position.z =
        THREE.MathUtils.clamp(
            camera.position.z,
            -37,
            37
        );


    // CAMERA BOB

    const horizontalSpeed =
        Math.sqrt(
            player.velocity.x ** 2 +
            player.velocity.z ** 2
        );


    if (
        player.grounded &&
        horizontalSpeed > 2
    ) {

        player.bobTime +=
            delta *
            (
                sprinting
                    ? 18
                    : 13
            );


        camera.position.y =
            player.height +
            Math.sin(
                player.bobTime
            ) *
            (
                sprinting
                    ? 0.06
                    : 0.035
            );

    }


    document
        .getElementById(
            "staminaBar"
        )
        .style.width =
        player.stamina + "%";
}


// ============================================================
// ENEMIES
// ============================================================

const enemies = [];

let kills = 0;


function createEnemy(
    position
) {

    const group =
        new THREE.Group();


    // BODY

    const body =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1.5,
                2.4,
                1.2
            ),

            new THREE.MeshStandardMaterial({
                color: 0x6d0d1d,
                roughness: 0.4,
                metalness: 0.7
            })

        );


    body.position.y =
        1.2;


    body.castShadow =
        true;


    group.add(
        body
    );


    // HEAD

    const head =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1.0,
                0.8,
                0.9
            ),

            new THREE.MeshStandardMaterial({
                color: 0x350912,
                emissive: 0x330008
            })

        );


    head.position.y =
        2.75;


    head.castShadow =
        true;


    group.add(
        head
    );


    // EYE

    const eye =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                0.65,
                0.12,
                0.05
            ),

            new THREE.MeshBasicMaterial({
                color: 0xff174f
            })

        );


    eye.position.set(
        0,
        2.75,
        -0.46
    );


    group.add(
        eye
    );


    // LIGHT

    const light =
        new THREE.PointLight(
            0xff003c,
            4,
            7
        );


    light.position.set(
        0,
        2.5,
        0
    );


    group.add(
        light
    );


    group.position.copy(
        position
    );


    scene.add(
        group
    );


    const enemy = {

        mesh: group,

        health: 100,

        speed:
            5 +
            Math.random() * 2,

        shootTimer:
            1 +
            Math.random() * 2,

        alive: true,

        hitTimer: 0

    };


    enemies.push(
        enemy
    );


    return enemy;
}


// ============================================================
// SPAWN ENEMIES
// ============================================================

function spawnEnemy() {

    if (
        enemies.filter(
            e => e.alive
        ).length >= 8
    ) {

        return;
    }


    let position;


    do {

        position =
            new THREE.Vector3(
                THREE.MathUtils.randFloat(
                    -30,
                    30
                ),
                0,
                THREE.MathUtils.randFloat(
                    -30,
                    30
                )
            );

    } while (
        position.distanceTo(
            camera.position
        ) < 12
    );


    createEnemy(
        position
    );
}


for (
    let i = 0;
    i < 5;
    i++
) {

    spawnEnemy();

}


// ============================================================
// ENEMY AI
// ============================================================

function updateEnemies(
    delta
) {

    for (
        const enemy of enemies
    ) {

        if (
            !enemy.alive
        ) {

            continue;
        }


        enemy.hitTimer -=
            delta;


        const direction =
            new THREE.Vector3();


        direction.subVectors(
            camera.position,
            enemy.mesh.position
        );


        direction.y = 0;


        const distance =
            direction.length();


        direction.normalize();


        // Move toward player

        if (
            distance > 6
        ) {

            enemy.mesh.position.add(
                direction.multiplyScalar(
                    enemy.speed *
                    delta
                )
            );

        }


        // Face player

        enemy.mesh.lookAt(
            camera.position.x,
            enemy.mesh.position.y,
            camera.position.z
        );


        // Shoot

        enemy.shootTimer -=
            delta;


        if (
            enemy.shootTimer <= 0 &&
            distance < 30
        ) {

            enemy.shootTimer =
                1.2 +
                Math.random() *
                1.5;


            enemyShoot(
                enemy
            );

        }


        // Melee damage

        if (
            distance < 2.3
        ) {

            damagePlayer(
                18 * delta
            );

        }

    }
}


// ============================================================
// ENEMY PROJECTILE
// ============================================================

const projectiles = [];


function enemyShoot(
    enemy
) {

    const projectile =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                0.18,
                10,
                10
            ),

            new THREE.MeshBasicMaterial({
                color: 0xff174f
            })

        );


    projectile.position.copy(
        enemy.mesh.position
    );


    projectile.position.y +=
        1.6;


    const direction =
        new THREE.Vector3();


    direction.subVectors(
        camera.position,
        projectile.position
    );


    direction.normalize();


    scene.add(
        projectile
    );


    projectiles.push({

        mesh:
            projectile,

        velocity:
            direction.multiplyScalar(
                16
            ),

        life:
            4

    });

}


// ============================================================
// PROJECTILES
// ============================================================

function updateProjectiles(
    delta
) {

    for (
        let i =
            projectiles.length - 1;
        i >= 0;
        i--
    ) {

        const projectile =
            projectiles[i];


        projectile.mesh.position.add(
            projectile.velocity
                .clone()
                .multiplyScalar(delta)
        );


        projectile.life -=
            delta;


        const distance =
            projectile.mesh.position
                .distanceTo(
                    camera.position
                );


        if (
            distance < 0.8
        ) {

            damagePlayer(
                15
            );


            removeProjectile(
                i
            );

            continue;
        }


        if (
            projectile.life <= 0
        ) {

            removeProjectile(
                i
            );

        }

    }

}


function removeProjectile(
    index
) {

    scene.remove(
        projectiles[index].mesh
    );


    projectiles.splice(
        index,
        1
    );

}


// ============================================================
// PLAYER DAMAGE
// ============================================================

function damagePlayer(
    amount
) {

    if (
        !player.alive
    ) {

        return;
    }


    player.health -=
        amount;


    player.health =
        Math.max(
            0,
            player.health
        );


    document
        .getElementById(
            "health"
        )
        .textContent =
        Math.ceil(
            player.health
        );


    const flash =
        document.getElementById(
            "damageFlash"
        );


    flash.style.background =
        "rgba(255,0,30,0.25)";


    setTimeout(
        () => {

            flash.style.background =
                "rgba(255,0,30,0)";

        },
        100
    );


    if (
        player.health <= 0
    ) {

        playerDeath();

    }

}


// ============================================================
// PLAYER DEATH
// ============================================================

function playerDeath() {

    player.alive =
        false;


    controls.unlock();


    deathScreen.style.display =
        "flex";

}


// ============================================================
// SHOOTING
// ============================================================

document.addEventListener(
    "mousedown",
    event => {

        if (
            event.button !== 0 ||
            !controls.isLocked ||
            !player.alive
        ) {

            return;
        }


        shoot();

    }
);


function shoot() {

    // Recoil

    camera.rotation.x +=
        THREE.MathUtils.degToRad(
            1.2
        );


    // Gun animation

    const weapon =
        document.getElementById(
            "weapon"
        );


    weapon.animate(
        [
            {
                transform:
                    "translateX(-50%) rotate(-3deg)"
            },

            {
                transform:
                    "translateX(-50%) translateY(25px) rotate(-3deg)"
            },

            {
                transform:
                    "translateX(-50%) rotate(-3deg)"
            }
        ],
        {
            duration: 100,
            easing:
                "ease-out"
        }
    );


    // Raycast

    const origin =
        camera.position.clone();


    const direction =
        new THREE.Vector3();


    camera.getWorldDirection(
        direction
    );


    const raycaster =
        new THREE.Raycaster(
            origin,
            direction,
            0,
            100
        );


    // Check enemies

    const enemyMeshes = [];


    for (
        const enemy of enemies
    ) {

        if (
            !enemy.alive
        ) {

            continue;
        }


        enemy.mesh.traverse(
            object => {

                if (
                    object.isMesh
                ) {

                    object.userData.enemy =
                        enemy;

                    enemyMeshes.push(
                        object
                    );

                }

            }
        );

    }


    const hits =
        raycaster.intersectObjects(
            enemyMeshes,
            false
        );


    if (
        hits.length > 0
    ) {

        const enemy =
            hits[0]
                .object
                .userData
                .enemy;


        damageEnemy(
            enemy,
            50,
            hits[0].point
        );


        showHitmarker();

    }


    // Environment

    const environmentHits =
        raycaster.intersectObjects(
            collisionObjects,
            false
        );


    if (
        environmentHits.length > 0
    ) {

        createImpact(
            environmentHits[0].point
        );

    }


    createMuzzleFlash();

}


// ============================================================
// DAMAGE ENEMY
// ============================================================

function damageEnemy(
    enemy,
    damage,
    position
) {

    if (
        !enemy.alive
    ) {

        return;
    }


    enemy.health -=
        damage;


    enemy.hitTimer =
        0.1;


    createBloodEffect(
        position
    );


    if (
        enemy.health <= 0
    ) {

        killEnemy(
            enemy
        );

    }

}


// ============================================================
// KILL ENEMY
// ============================================================

function killEnemy(
    enemy
) {

    enemy.alive =
        false;


    kills++;


    document
        .getElementById(
            "kills"
        )
        .textContent =
        "KILLS: " +
        kills;


    createExplosion(
        enemy.mesh.position
            .clone()
            .add(
                new THREE.Vector3(
                    0,
                    1.5,
                    0
                )
            )
    );


    scene.remove(
        enemy.mesh
    );


    setTimeout(
        () => {

            spawnEnemy();

        },
        1200
    );

}


// ============================================================
// MUZZLE FLASH
// ============================================================

function createMuzzleFlash() {

    const light =
        new THREE.PointLight(
            0xffaa44,
            35,
            10
        );


    light.position.copy(
        camera.position
    );


    const direction =
        new THREE.Vector3();


    camera.getWorldDirection(
        direction
    );


    light.position.add(
        direction.multiplyScalar(
            1
        )
    );


    scene.add(
        light
    );


    setTimeout(
        () => {

            scene.remove(
                light
            );

        },
        55
    );

}


// ============================================================
// IMPACT
// ============================================================

function createImpact(
    position
) {

    const mesh =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                0.12,
                8,
                8
            ),

            new THREE.MeshBasicMaterial({
                color: 0xffaa00
            })

        );


    mesh.position.copy(
        position
    );


    scene.add(
        mesh
    );


    setTimeout(
        () => {

            scene.remove(
                mesh
            );

        },
        120
    );

}


// ============================================================
// BLOOD / HIT PARTICLES
// ============================================================

function createBloodEffect(
    position
) {

    for (
        let i = 0;
        i < 8;
        i++
    ) {

        const particle =
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    0.05,
                    6,
                    6
                ),

                new THREE.MeshBasicMaterial({
                    color:
                        0xff174f
                })

            );


        particle.position.copy(
            position
        );


        particle.velocity =
            new THREE.Vector3(

                (Math.random() - 0.5)
                    * 5,

                Math.random() * 5,

                (Math.random() - 0.5)
                    * 5

            );


        scene.add(
            particle
        );


        animateParticle(
            particle,
            0.5
        );

    }

}


// ============================================================
// EXPLOSION
// ============================================================

function createExplosion(
    position
) {

    const particles = [];


    for (
        let i = 0;
        i < 25;
        i++
    ) {

        const particle =
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    0.08 +
                    Math.random() * 0.08,
                    6,
                    6
                ),

                new THREE.MeshBasicMaterial({
                    color:
                        Math.random() > 0.5
                            ? 0xff174f
                            : 0xffaa00
                })

            );


        particle.position.copy(
            position
        );


        particle.velocity =
            new THREE.Vector3(

                (Math.random() - 0.5)
                    * 12,

                (Math.random() - 0.5)
                    * 12,

                (Math.random() - 0.5)
                    * 12

            );


        scene.add(
            particle
        );


        particles.push(
            particle
        );

    }


    const light =
        new THREE.PointLight(
            0xff174f,
            50,
            15
        );


    light.position.copy(
        position
    );


    scene.add(
        light
    );


    setTimeout(
        () => {

            scene.remove(
                light
            );

        },
        100
    );


    for (
        const particle of particles
    ) {

        animateParticle(
            particle,
            0.8
        );

    }

}


// ============================================================
// PARTICLE ANIMATION
// ============================================================

function animateParticle(
    particle,
    life
) {

    const start =
        performance.now();


    function update() {

        const elapsed =
            (
                performance.now() -
                start
            ) / 1000;


        if (
            elapsed >= life
        ) {

            scene.remove(
                particle
            );

            return;
        }


        particle.position.add(
            particle.velocity
                .clone()
                .multiplyScalar(
                    0.016
                )
        );


        particle.velocity.y -=
            9.8 * 0.016;


        particle.scale.multiplyScalar(
            0.97
        );


        requestAnimationFrame(
            update
        );

    }


    update();

}


// ============================================================
// HIT MARKER
// ============================================================

function showHitmarker() {

    const marker =
        document.getElementById(
            "hitmarker"
        );


    marker.style.transform =
        "translate(-50%, -50%) scale(1)";


    marker.style.opacity =
        "1";


    setTimeout(
        () => {

            marker.style.transform =
                "translate(-50%, -50%) scale(0)";

            marker.style.opacity =
                "0";

        },
        100
    );

}


// ============================================================
// RESIZE
// ============================================================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


// ============================================================
// GAME LOOP
// ============================================================

function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            0.05
        );


    if (
        controls.isLocked &&
        player.alive
    ) {

        updatePlayer(
            delta
        );

        updateEnemies(
            delta
        );

        updateProjectiles(
            delta
        );

    }


    renderer.render(
        scene,
        camera
    );

}


animate();

</script>

</body>
</html>
