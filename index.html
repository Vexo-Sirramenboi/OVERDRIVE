<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OVERDRIVE</title>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js"
        }
    }
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050509;
            font-family: Arial, Helvetica, sans-serif;
            user-select: none;
        }

        #game {
            position: fixed;
            inset: 0;
        }

        canvas {
            display: block;
        }

        /* CROSSHAIR */

        #crosshair {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }

        #crosshair::before,
        #crosshair::after {
            content: "";
            position: absolute;
            background: white;
            box-shadow:
                0 0 5px #00ffff,
                0 0 12px #00ffff;
        }

        #crosshair::before {
            width: 2px;
            height: 20px;
            left: 9px;
            top: 0;
        }

        #crosshair::after {
            width: 20px;
            height: 2px;
            left: 0;
            top: 9px;
        }

        /* HUD */

        #hud {
            position: fixed;
            left: 25px;
            bottom: 25px;
            color: white;
            z-index: 10;
            pointer-events: none;
        }

        #health {
            color: #ff3155;
            font-size: 34px;
            font-weight: 900;
            text-shadow:
                0 0 8px #ff3155,
                0 0 20px rgba(255, 0, 60, 0.6);
        }

        #healthLabel {
            color: #aaa;
            font-size: 10px;
            letter-spacing: 4px;
        }

        #staminaContainer {
            width: 220px;
            height: 8px;
            margin-top: 12px;
            background: #17171e;
            border: 1px solid #444;
        }

        #staminaBar {
            width: 100%;
            height: 100%;
            background: #00eaff;
            box-shadow:
                0 0 8px #00eaff,
                0 0 18px rgba(0, 234, 255, 0.5);
        }

        /* START SCREEN */

        #startScreen {
            position: fixed;
            inset: 0;
            z-index: 50;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            background:
                radial-gradient(
                    circle at center,
                    rgba(0, 100, 140, 0.15),
                    rgba(0, 0, 0, 0.94) 70%
                );
        }

        #title {
            margin: 0;

            color: white;

            font-size:
                clamp(55px, 10vw, 130px);

            font-weight: 1000;

            letter-spacing: 18px;

            text-shadow:
                0 0 10px #00ffff,
                0 0 30px #0088ff,
                0 0 70px rgba(0, 150, 255, 0.7);
        }

        #subtitle {
            margin-top: 10px;

            color: #00eaff;

            font-size: 13px;

            letter-spacing: 7px;
        }

        #clickText {
            margin-top: 55px;

            color: white;

            font-size: 14px;

            letter-spacing: 5px;

            animation:
                pulse 1.2s infinite alternate;
        }

        @keyframes pulse {
            from {
                opacity: 0.35;
            }

            to {
                opacity: 1;
            }
        }

        /* PAUSE */

        #pauseScreen {
            position: fixed;
            inset: 0;

            z-index: 40;

            display: none;

            align-items: center;
            justify-content: center;

            flex-direction: column;

            background:
                rgba(0, 0, 0, 0.65);

            backdrop-filter: blur(5px);

            pointer-events: none;
        }

        #pauseScreen h2 {
            margin: 0;

            color: white;

            font-size: 55px;

            letter-spacing: 10px;
        }

        #pauseScreen p {
            color: #888;

            letter-spacing: 3px;
        }

        /* VIGNETTE */

        #vignette {
            position: fixed;
            inset: 0;

            z-index: 5;

            pointer-events: none;

            background:
                radial-gradient(
                    circle,
                    transparent 45%,
                    rgba(0, 0, 0, 0.55) 100%
                );
        }

        /* DAMAGE */

        #damageFlash {
            position: fixed;
            inset: 0;

            z-index: 20;

            pointer-events: none;

            background:
                rgba(255, 0, 30, 0);
        }
    </style>
</head>

<body>

<div id="game"></div>

<div id="crosshair"></div>

<div id="vignette"></div>

<div id="damageFlash"></div>

<div id="hud">

    <div id="health">
        100
    </div>

    <div id="healthLabel">
        INTEGRITY
    </div>

    <div id="staminaContainer">
        <div id="staminaBar"></div>
    </div>

</div>

<div id="startScreen">

    <h1 id="title">
        OVERDRIVE
    </h1>

    <div id="subtitle">
        COMBAT SYSTEM ONLINE
    </div>

    <div id="clickText">
        CLICK TO ENTER
    </div>

</div>

<div id="pauseScreen">

    <h2>
        PAUSED
    </h2>

    <p>
        CLICK TO RETURN
    </p>

</div>


<script type="module">

import * as THREE from "three";

import {
    PointerLockControls
} from "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/controls/PointerLockControls.js";


// ============================================================
// SCENE
// ============================================================

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x050509
    );

scene.fog =
    new THREE.FogExp2(
        0x050509,
        0.025
    );


// ============================================================
// CAMERA
// ============================================================

const camera =
    new THREE.PerspectiveCamera(
        90,
        window.innerWidth /
        window.innerHeight,
        0.05,
        500
    );

camera.position.set(
    0,
    2,
    15
);


// ============================================================
// RENDERER
// ============================================================

const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        powerPreference:
            "high-performance"
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled =
    true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document
    .getElementById("game")
    .appendChild(
        renderer.domElement
    );


// ============================================================
// POINTER LOCK
// ============================================================

const controls =
    new PointerLockControls(
        camera,
        document.body
    );


// ============================================================
// LIGHTING
// ============================================================

const ambient =
    new THREE.HemisphereLight(
        0x6688ff,
        0x080808,
        1.5
    );

scene.add(
    ambient
);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sun.position.set(
    10,
    25,
    10
);

sun.castShadow = true;

sun.shadow.mapSize.width =
    2048;

sun.shadow.mapSize.height =
    2048;

scene.add(
    sun
);


// ============================================================
// FLOOR
// ============================================================

const floorMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x101018,
        roughness: 0.6,
        metalness: 0.5
    });


const floor =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            80,
            1,
            80
        ),
        floorMaterial
    );

floor.position.y =
    -0.5;

floor.receiveShadow =
    true;

scene.add(
    floor
);


// ============================================================
// COLLISION OBJECTS
// ============================================================

const collisionObjects = [];


// ============================================================
// WALL FUNCTION
// ============================================================

function createWall(
    x,
    y,
    z,
    width,
    height,
    depth
) {

    const material =
        new THREE.MeshStandardMaterial({
            color: 0x151520,
            roughness: 0.45,
            metalness: 0.75
        });


    const wall =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),
            material
        );


    wall.position.set(
        x,
        y,
        z
    );


    wall.castShadow =
        true;

    wall.receiveShadow =
        true;


    scene.add(
        wall
    );


    collisionObjects.push(
        wall
    );


    return wall;
}


// Arena boundaries

createWall(
    0,
    5,
    -40,
    80,
    10,
    2
);

createWall(
    0,
    5,
    40,
    80,
    10,
    2
);

createWall(
    -40,
    5,
    0,
    2,
    10,
    80
);

createWall(
    40,
    5,
    0,
    2,
    10,
    80
);


// ============================================================
// BLOCK FUNCTION
// ============================================================

function createBlock(
    x,
    y,
    z,
    width,
    height,
    depth,
    color = 0x202030
) {

    const material =
        new THREE.MeshStandardMaterial({
            color: color,
            roughness: 0.35,
            metalness: 0.8
        });


    const block =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),
            material
        );


    block.position.set(
        x,
        y,
        z
    );


    block.castShadow =
        true;

    block.receiveShadow =
        true;


    scene.add(
        block
    );


    collisionObjects.push(
        block
    );


    return block;
}


// Arena structures

createBlock(
    -13,
    3,
    -10,
    8,
    6,
    8
);

createBlock(
    13,
    3,
    -14,
    8,
    6,
    8
);

createBlock(
    -15,
    2,
    13,
    10,
    4,
    6
);

createBlock(
    15,
    4,
    14,
    8,
    8,
    8
);


// ============================================================
// GRID
// ============================================================

const grid =
    new THREE.GridHelper(
        80,
        80,
        0x00ffff,
        0x202030
    );

grid.position.y =
    0.015;

scene.add(
    grid
);


// ============================================================
// NEON LIGHTS
// ============================================================

function createNeon(
    x,
    y,
    z,
    color
) {

    const light =
        new THREE.PointLight(
            color,
            25,
            28
        );


    light.position.set(
        x,
        y,
        z
    );


    scene.add(
        light
    );


    const orb =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.18,
                16,
                16
            ),
            new THREE.MeshBasicMaterial({
                color: color
            })
        );


    orb.position.copy(
        light.position
    );


    scene.add(
        orb
    );
}


createNeon(
    -20,
    5,
    -20,
    0x00ffff
);

createNeon(
    20,
    5,
    -20,
    0xff0066
);

createNeon(
    -20,
    5,
    20,
    0x6633ff
);

createNeon(
    20,
    5,
    20,
    0x00ffff
);


// ============================================================
// PLAYER
// ============================================================

const player = {

    height: 2,

    velocity:
        new THREE.Vector3(),

    groundSpeed: 20,

    sprintSpeed: 32,

    jumpPower: 11,

    dashPower: 42,

    health: 100,

    stamina: 100,

    grounded: true,

    canDash: true,

    dashCooldown: false,

    bobTime: 0,

    wasMoving: false
};


camera.position.y =
    player.height;


// ============================================================
// INPUT
// ============================================================

const keys = {};


document.addEventListener(
    "keydown",
    event => {

        keys[event.code] =
            true;


        // Jump

        if (
            event.code === "Space" &&
            player.grounded
        ) {

            player.velocity.y =
                player.jumpPower;

            player.grounded =
                false;
        }


        // Dash

        if (
            event.code === "KeyQ"
        ) {

            dash();
        }

    }
);


document.addEventListener(
    "keyup",
    event => {

        keys[event.code] =
            false;
    }
);


// ============================================================
// START SCREEN
// ============================================================

const startScreen =
    document.getElementById(
        "startScreen"
    );


const pauseScreen =
    document.getElementById(
        "pauseScreen"
    );


startScreen.addEventListener(
    "click",
    () => {

        controls.lock();

    }
);


pauseScreen.addEventListener(
    "click",
    () => {

        controls.lock();

    }
);


controls.addEventListener(
    "lock",
    () => {

        startScreen.style.display =
            "none";

        pauseScreen.style.display =
            "none";

    }
);


controls.addEventListener(
    "unlock",
    () => {

        if (
            player.health > 0
        ) {

            pauseScreen.style.display =
                "flex";
        }

    }
);


// ============================================================
// DASH
// ============================================================

function dash() {

    if (
        !controls.isLocked ||
        !player.canDash ||
        player.dashCooldown
    ) {
        return;
    }


    const direction =
        new THREE.Vector3();


    camera.getWorldDirection(
        direction
    );


    direction.y = 0;

    direction.normalize();


    /*
        Add momentum rather than
        completely replacing velocity.
    */

    player.velocity.addScaledVector(
        direction,
        player.dashPower
    );


    player.canDash =
        false;

    player.dashCooldown =
        true;


    setTimeout(
        () => {

            player.canDash =
                true;

        },
        650
    );


    setTimeout(
        () => {

            player.dashCooldown =
                false;

        },
        200
    );
}


// ============================================================
// MOVEMENT
// ============================================================

const clock =
    new THREE.Clock();


function updatePlayer(
    delta
) {

    // --------------------------------
    // INPUT
    // --------------------------------

    let forward = 0;
    let right = 0;


    if (
        keys["KeyW"]
    ) {

        forward += 1;
    }


    if (
        keys["KeyS"]
    ) {

        forward -= 1;
    }


    if (
        keys["KeyD"]
    ) {

        right += 1;
    }


    if (
        keys["KeyA"]
    ) {

        right -= 1;
    }


    const moving =
        forward !== 0 ||
        right !== 0;


    const sprinting =
        (
            keys["ShiftLeft"] ||
            keys["ShiftRight"]
        ) &&
        moving &&
        player.stamina > 0;


    const targetSpeed =
        sprinting
            ? player.sprintSpeed
            : player.groundSpeed;


    // --------------------------------
    // STAMINA
    // --------------------------------

    if (
        sprinting
    ) {

        player.stamina -=
            35 * delta;

    } else {

        player.stamina +=
            25 * delta;

    }


    player.stamina =
        THREE.MathUtils.clamp(
            player.stamina,
            0,
            100
        );


    // --------------------------------
    // CAMERA DIRECTIONS
    // --------------------------------

    const forwardVector =
        new THREE.Vector3();


    camera.getWorldDirection(
        forwardVector
    );


    forwardVector.y = 0;

    forwardVector.normalize();


    /*
        This is the important fix.

        Right is calculated from
        the camera's forward vector
        using the correct perpendicular.
    */

    const rightVector =
        new THREE.Vector3(
            -forwardVector.z,
            0,
            forwardVector.x
        );


    // --------------------------------
    // DESIRED MOVEMENT
    // --------------------------------

    const desired =
        new THREE.Vector3();


    desired.addScaledVector(
        forwardVector,
        forward
    );


    desired.addScaledVector(
        rightVector,
        right
    );


    // Normalize diagonal movement

    if (
        desired.lengthSq() > 0
    ) {

        desired.normalize();

    }


    // --------------------------------
    // ACCELERATION
    // --------------------------------

    const groundAcceleration =
        110;


    const airAcceleration =
        35;


    const acceleration =
        player.grounded
            ? groundAcceleration
            : airAcceleration;


    if (
        moving
    ) {

        const targetX =
            desired.x *
            targetSpeed;


        const targetZ =
            desired.z *
            targetSpeed;


        player.velocity.x =
            moveToward(
                player.velocity.x,
                targetX,
                acceleration * delta
            );


        player.velocity.z =
            moveToward(
                player.velocity.z,
                targetZ,
                acceleration * delta
            );

    } else {

        // Ground friction

        if (
            player.grounded
        ) {

            player.velocity.x =
                moveToward(
                    player.velocity.x,
                    0,
                    90 * delta
                );


            player.velocity.z =
                moveToward(
                    player.velocity.z,
                    0,
                    90 * delta
                );
        }

    }


    // --------------------------------
    // GRAVITY
    // --------------------------------

    player.velocity.y -=
        30 * delta;


    // --------------------------------
    // POSITION
    // --------------------------------

    camera.position.x +=
        player.velocity.x *
        delta;


    camera.position.y +=
        player.velocity.y *
        delta;


    camera.position.z +=
        player.velocity.z *
        delta;


    // --------------------------------
    // GROUND
    // --------------------------------

    if (
        camera.position.y <=
        player.height
    ) {

        camera.position.y =
            player.height;

        player.velocity.y =
            0;

        player.grounded =
            true;

    } else {

        player.grounded =
            false;

    }


    // --------------------------------
    // BOUNDARIES
    // --------------------------------

    camera.position.x =
        THREE.MathUtils.clamp(
            camera.position.x,
            -37,
            37
        );


    camera.position.z =
        THREE.MathUtils.clamp(
            camera.position.z,
            -37,
            37
        );


    // --------------------------------
    // CAMERA BOB
    // --------------------------------

    const horizontalSpeed =
        Math.sqrt(
            player.velocity.x ** 2 +
            player.velocity.z ** 2
        );


    if (
        player.grounded &&
        horizontalSpeed > 1
    ) {

        player.bobTime +=
            delta *
            (
                sprinting
                    ? 17
                    : 12
            );


        const bobAmount =
            sprinting
                ? 0.055
                : 0.035;


        camera.position.y =
            player.height +
            Math.sin(
                player.bobTime
            ) *
            bobAmount;

    }


    // --------------------------------
    // STAMINA HUD
    // --------------------------------

    document
        .getElementById(
            "staminaBar"
        )
        .style.width =
        player.stamina + "%";


    // --------------------------------
    // SAVE MOVEMENT STATE
    // --------------------------------

    player.wasMoving =
        moving;
}


// ============================================================
// MOVE TOWARD
// ============================================================

function moveToward(
    current,
    target,
    maxDelta
) {

    if (
        Math.abs(
            target - current
        ) <= maxDelta
    ) {

        return target;
    }


    return current +
        Math.sign(
            target - current
        ) *
        maxDelta;
}


// ============================================================
// SHOOTING
// ============================================================

document.addEventListener(
    "mousedown",
    event => {

        if (
            event.button !== 0 ||
            !controls.isLocked
        ) {

            return;
        }


        shoot();

    }
);


function shoot() {

    // Recoil

    camera.rotation.x +=
        THREE.MathUtils.degToRad(
            0.65
        );


    const origin =
        camera.position.clone();


    const direction =
        new THREE.Vector3();


    camera.getWorldDirection(
        direction
    );


    const raycaster =
        new THREE.Raycaster(
            origin,
            direction,
            0,
            150
        );


    const hits =
        raycaster.intersectObjects(
            collisionObjects,
            false
        );


    if (
        hits.length > 0
    ) {

        createImpact(
            hits[0].point,
            direction
        );

    }


    createMuzzleFlash();

}


// ============================================================
// MUZZLE FLASH
// ============================================================

function createMuzzleFlash() {

    const flash =
        new THREE.PointLight(
            0xffaa44,
            20,
            8
        );


    flash.position.copy(
        camera.position
    );


    const direction =
        new THREE.Vector3();


    camera.getWorldDirection(
        direction
    );


    flash.position.add(
        direction.multiplyScalar(
            0.8
        )
    );


    scene.add(
        flash
    );


    setTimeout(
        () => {

            scene.remove(
                flash
            );

        },
        45
    );
}


// ============================================================
// BULLET IMPACT
// ============================================================

function createImpact(
    position,
    direction
) {

    const geometry =
        new THREE.SphereGeometry(
            0.09,
            8,
            8
        );


    const material =
        new THREE.MeshBasicMaterial({
            color: 0xffaa00
        });


    const impact =
        new THREE.Mesh(
            geometry,
            material
        );


    impact.position.copy(
        position
    );


    scene.add(
        impact
    );


    setTimeout(
        () => {

            scene.remove(
                impact
            );

        },
        120
    );
}


// ============================================================
// RESIZE
// ============================================================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


// ============================================================
// GAME LOOP
// ============================================================

function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            0.05
        );


    if (
        controls.isLocked
    ) {

        updatePlayer(
            delta
        );

    }


    renderer.render(
        scene,
        camera
    );
}


animate();

</script>

</body>
</html>
