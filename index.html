<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OVERDRIVE</title>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js"
        }
    }
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050509;
            font-family: Arial, Helvetica, sans-serif;
            user-select: none;
        }

        #game {
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
        }

        /* =========================
           CROSSHAIR
        ========================= */

        #crosshair {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 22px;
            height: 22px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }

        #crosshair::before,
        #crosshair::after {
            content: "";
            position: absolute;
            background: white;
            box-shadow:
                0 0 5px #00ffff,
                0 0 12px #00ffff;
        }

        #crosshair::before {
            width: 2px;
            height: 22px;
            left: 10px;
            top: 0;
        }

        #crosshair::after {
            width: 22px;
            height: 2px;
            left: 0;
            top: 10px;
        }

        /* =========================
           HUD
        ========================= */

        #hud {
            position: fixed;
            left: 25px;
            bottom: 25px;
            color: white;
            z-index: 10;
            pointer-events: none;
        }

        #health {
            font-size: 34px;
            font-weight: 900;
            color: #ff3155;
            text-shadow:
                0 0 8px #ff3155,
                0 0 20px rgba(255, 0, 60, 0.5);
        }

        #healthLabel {
            font-size: 11px;
            letter-spacing: 4px;
            color: #aaa;
            margin-top: -5px;
        }

        #staminaContainer {
            margin-top: 12px;
            width: 220px;
            height: 8px;
            background: #16161d;
            border: 1px solid #444;
        }

        #staminaBar {
            width: 100%;
            height: 100%;
            background: #00eaff;
            box-shadow:
                0 0 8px #00eaff,
                0 0 18px rgba(0, 234, 255, 0.5);
        }

        /* =========================
           START SCREEN
        ========================= */

        #startScreen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 50;
            background:
                radial-gradient(
                    circle at center,
                    rgba(0, 100, 140, 0.16),
                    rgba(0, 0, 0, 0.92) 65%
                );
            cursor: pointer;
        }

        #title {
            margin: 0;
            color: white;
            font-size: clamp(55px, 10vw, 130px);
            font-weight: 1000;
            letter-spacing: 18px;
            text-shadow:
                0 0 10px #00ffff,
                0 0 30px #00aaff,
                0 0 70px rgba(0, 150, 255, 0.7);
        }

        #subtitle {
            margin-top: 12px;
            color: #00eaff;
            letter-spacing: 7px;
            font-size: 13px;
        }

        #clickText {
            margin-top: 55px;
            color: white;
            letter-spacing: 5px;
            font-size: 14px;
            animation: pulse 1.2s infinite alternate;
        }

        @keyframes pulse {
            from {
                opacity: 0.35;
            }

            to {
                opacity: 1;
            }
        }

        /* =========================
           PAUSE
        ========================= */

        #pauseScreen {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 40;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(5px);
            pointer-events: none;
        }

        #pauseScreen h2 {
            color: white;
            font-size: 50px;
            letter-spacing: 10px;
            margin: 0;
        }

        #pauseScreen p {
            color: #888;
            letter-spacing: 3px;
        }

        /* =========================
           DAMAGE FLASH
        ========================= */

        #damageFlash {
            position: fixed;
            inset: 0;
            background: rgba(255, 0, 30, 0);
            pointer-events: none;
            z-index: 20;
        }

        /* =========================
           VIGNETTE
        ========================= */

        #vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            background:
                radial-gradient(
                    circle,
                    transparent 45%,
                    rgba(0, 0, 0, 0.55) 100%
                );
        }
    </style>
</head>

<body>

    <div id="game"></div>

    <div id="crosshair"></div>

    <div id="vignette"></div>

    <div id="damageFlash"></div>

    <div id="hud">
        <div id="health">100</div>
        <div id="healthLabel">INTEGRITY</div>

        <div id="staminaContainer">
            <div id="staminaBar"></div>
        </div>
    </div>

    <div id="startScreen">
        <h1 id="title">OVERDRIVE</h1>
        <div id="subtitle">COMBAT SYSTEM ONLINE</div>
        <div id="clickText">CLICK TO ENTER</div>
    </div>

    <div id="pauseScreen">
        <h2>PAUSED</h2>
        <p>CLICK TO RETURN</p>
    </div>


<script type="module">

import * as THREE from "three";

import {
    PointerLockControls
} from "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/controls/PointerLockControls.js";


// ============================================================
// GAME SETUP
// ============================================================

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x050509);

scene.fog =
    new THREE.FogExp2(
        0x050509,
        0.025
    );


const camera =
    new THREE.PerspectiveCamera(
        90,
        window.innerWidth / window.innerHeight,
        0.05,
        500
    );


camera.position.set(
    0,
    2,
    15
);


const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance"
    });


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


document
    .getElementById("game")
    .appendChild(renderer.domElement);


// ============================================================
// POINTER LOCK
// ============================================================

const controls =
    new PointerLockControls(
        camera,
        document.body
    );


// ============================================================
// LIGHTING
// ============================================================

const ambient =
    new THREE.HemisphereLight(
        0x6688ff,
        0x080808,
        1.5
    );

scene.add(ambient);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sun.position.set(
    10,
    25,
    10
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

scene.add(sun);


// ============================================================
// FLOOR
// ============================================================

const floorMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x101018,
        roughness: 0.6,
        metalness: 0.5
    });


const floor =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            80,
            1,
            80
        ),
        floorMaterial
    );


floor.position.y = -0.5;

floor.receiveShadow = true;

scene.add(floor);


// ============================================================
// WALLS
// ============================================================

const collisionObjects = [];


function createWall(
    x,
    y,
    z,
    width,
    height,
    depth
) {

    const material =
        new THREE.MeshStandardMaterial({
            color: 0x151520,
            roughness: 0.45,
            metalness: 0.75
        });


    const wall =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),
            material
        );


    wall.position.set(
        x,
        y,
        z
    );


    wall.castShadow = true;
    wall.receiveShadow = true;


    scene.add(wall);

    collisionObjects.push(wall);

    return wall;
}


createWall(
    0,
    5,
    -40,
    80,
    10,
    2
);

createWall(
    0,
    5,
    40,
    80,
    10,
    2
);

createWall(
    -40,
    5,
    0,
    2,
    10,
    80
);

createWall(
    40,
    5,
    0,
    2,
    10,
    80
);


// ============================================================
// ARENA BLOCKS
// ============================================================

function createBlock(
    x,
    y,
    z,
    width,
    height,
    depth,
    color = 0x202030
) {

    const material =
        new THREE.MeshStandardMaterial({
            color: color,
            roughness: 0.35,
            metalness: 0.8
        });


    const block =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),
            material
        );


    block.position.set(
        x,
        y,
        z
    );


    block.castShadow = true;
    block.receiveShadow = true;


    scene.add(block);

    collisionObjects.push(block);

    return block;
}


createBlock(
    -13,
    3,
    -10,
    8,
    6,
    8
);


createBlock(
    13,
    3,
    -14,
    8,
    6,
    8
);


createBlock(
    -15,
    2,
    13,
    10,
    4,
    6
);


createBlock(
    15,
    4,
    14,
    8,
    8,
    8
);


// ============================================================
// GRID
// ============================================================

const grid =
    new THREE.GridHelper(
        80,
        80,
        0x00ffff,
        0x202030
    );


grid.position.y = 0.015;

scene.add(grid);


// ============================================================
// NEON LIGHTS
// ============================================================

function createNeon(
    x,
    y,
    z,
    color
) {

    const light =
        new THREE.PointLight(
            color,
            25,
            28
        );


    light.position.set(
        x,
        y,
        z
    );


    scene.add(light);


    const orb =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.18,
                16,
                16
            ),
            new THREE.MeshBasicMaterial({
                color: color
            })
        );


    orb.position.copy(
        light.position
    );


    scene.add(orb);
}


createNeon(
    -20,
    5,
    -20,
    0x00ffff
);

createNeon(
    20,
    5,
    -20,
    0xff0066
);

createNeon(
    -20,
    5,
    20,
    0x6633ff
);

createNeon(
    20,
    5,
    20,
    0x00ffff
);


// ============================================================
// PLAYER
// ============================================================

const player = {

    height: 2,

    velocity:
        new THREE.Vector3(),

    moveSpeed: 20,

    sprintSpeed: 32,

    jumpPower: 11,

    dashPower: 42,

    health: 100,

    stamina: 100,

    grounded: true,

    canDash: true,

    dashCooldown: false,

    bobTime: 0
};


camera.position.y =
    player.height;


// ============================================================
// INPUT
// ============================================================

const keys = {};


document.addEventListener(
    "keydown",
    event => {

        keys[event.code] = true;


        if (
            event.code === "Space" &&
            player.grounded
        ) {

            player.velocity.y =
                player.jumpPower;

            player.grounded = false;
        }


        if (
            event.code === "KeyQ"
        ) {

            dash();
        }


        if (
            event.code === "Escape"
        ) {

            if (controls.isLocked) {
                controls.unlock();
            }
        }

    }
);


document.addEventListener(
    "keyup",
    event => {

        keys[event.code] = false;

    }
);


// ============================================================
// START GAME
// ============================================================

const startScreen =
    document.getElementById(
        "startScreen"
    );


const pauseScreen =
    document.getElementById(
        "pauseScreen"
    );


startScreen.addEventListener(
    "click",
    () => {

        controls.lock();

    }
);


controls.addEventListener(
    "lock",
    () => {

        startScreen.style.display =
            "none";

        pauseScreen.style.display =
            "none";

    }
);


controls.addEventListener(
    "unlock",
    () => {

        if (
            player.health > 0
        ) {

            pauseScreen.style.display =
                "flex";

        }

    }
);


pauseScreen.addEventListener(
    "click",
    () => {

        controls.lock();

    }
);


// ============================================================
// DASH
// ============================================================

function dash() {

    if (
        !controls.isLocked ||
        !player.canDash ||
        player.dashCooldown
    ) {
        return;
    }


    const direction =
        new THREE.Vector3();


    camera.getWorldDirection(
        direction
    );


    direction.y = 0;

    direction.normalize();


    player.velocity.add(
        direction.multiplyScalar(
            player.dashPower
        )
    );


    player.canDash = false;

    player.dashCooldown = true;


    setTimeout(
        () => {
            player.canDash = true;
        },
        650
    );


    setTimeout(
        () => {
            player.dashCooldown = false;
        },
        200
    );
}


// ============================================================
// PLAYER MOVEMENT
// ============================================================

const clock =
    new THREE.Clock();


function updatePlayer(
    delta
) {

    let forward = 0;
    let right = 0;


    if (keys["KeyW"])
        forward += 1;

    if (keys["KeyS"])
        forward -= 1;

    if (keys["KeyD"])
        right += 1;

    if (keys["KeyA"])
        right -= 1;


    const moving =
        forward !== 0 ||
        right !== 0;


    const sprinting =
        (
            keys["ShiftLeft"] ||
            keys["ShiftRight"]
        ) &&
        player.stamina > 0 &&
        moving;


    let speed =
        sprinting
            ? player.sprintSpeed
            : player.moveSpeed;


    // -------------------------
    // STAMINA
    // -------------------------

    if (sprinting) {

        player.stamina -=
            35 * delta;

    } else {

        player.stamina +=
            25 * delta;

    }


    player.stamina =
        THREE.MathUtils.clamp(
            player.stamina,
            0,
            100
        );


    // -------------------------
    // DIRECTION
    // -------------------------

    const forwardVector =
        new THREE.Vector3();


    camera.getWorldDirection(
        forwardVector
    );


    forwardVector.y = 0;

    forwardVector.normalize();


    const rightVector =
        new THREE.Vector3(
            forwardVector.z,
            0,
            -forwardVector.x
        );


    const desired =
        new THREE.Vector3();


    desired.addScaledVector(
        forwardVector,
        forward
    );


    desired.addScaledVector(
        rightVector,
        right
    );


    if (
        desired.lengthSq() > 0
    ) {

        desired.normalize();

    }


    // -------------------------
    // ACCELERATION
    // -------------------------

    const acceleration =
        95 * delta;


    player.velocity.x =
        THREE.MathUtils.lerp(
            player.velocity.x,
            desired.x * speed,
            Math.min(
                1,
                acceleration
            )
        );


    player.velocity.z =
        THREE.MathUtils.lerp(
            player.velocity.z,
            desired.z * speed,
            Math.min(
                1,
                acceleration
            )
        );


    // -------------------------
    // GRAVITY
    // -------------------------

    player.velocity.y -=
        28 * delta;


    // -------------------------
    // POSITION
    // -------------------------

    camera.position.x +=
        player.velocity.x * delta;


    camera.position.y +=
        player.velocity.y * delta;


    camera.position.z +=
        player.velocity.z * delta;


    // -------------------------
    // GROUND
    // -------------------------

    if (
        camera.position.y <=
        player.height
    ) {

        camera.position.y =
            player.height;

        player.velocity.y = 0;

        player.grounded = true;

    }


    // -------------------------
    // ARENA LIMITS
    // -------------------------

    camera.position.x =
        THREE.MathUtils.clamp(
            camera.position.x,
            -37,
            37
        );


    camera.position.z =
        THREE.MathUtils.clamp(
            camera.position.z,
            -37,
            37
        );


    // -------------------------
    // WEAPON-STYLE CAMERA BOB
    // -------------------------

    if (
        moving &&
        player.grounded
    ) {

        player.bobTime +=
            delta *
            (sprinting ? 15 : 10);


        camera.position.y =
            player.height +
            Math.sin(
                player.bobTime
            ) * 0.035;

    }


    // -------------------------
    // HUD
    // -------------------------

    document
        .getElementById(
            "staminaBar"
        )
        .style.width =
        player.stamina + "%";
}


// ============================================================
// SHOOTING
// ============================================================

document.addEventListener(
    "mousedown",
    event => {

        if (
            event.button !== 0 ||
            !controls.isLocked
        ) {
            return;
        }


        shoot();

    }
);


function shoot() {

    // Small recoil

    camera.rotation.x +=
        THREE.MathUtils.degToRad(
            0.7
        );


    const origin =
        camera.position.clone();


    const direction =
        new THREE.Vector3();


    camera.getWorldDirection(
        direction
    );


    const raycaster =
        new THREE.Raycaster(
            origin,
            direction,
            0,
            150
        );


    const hits =
        raycaster.intersectObjects(
            collisionObjects,
            false
        );


    if (
        hits.length > 0
    ) {

        createImpact(
            hits[0].point
        );

    }


    createMuzzleFlash();

}


// ============================================================
// MUZZLE FLASH
// ============================================================

function createMuzzleFlash() {

    const flash =
        new THREE.PointLight(
            0xffaa44,
            15,
            8
        );


    flash.position.copy(
        camera.position
    );


    const direction =
        new THREE.Vector3();


    camera.getWorldDirection(
        direction
    );


    flash.position.add(
        direction.multiplyScalar(
            0.8
        )
    );


    scene.add(flash);


    setTimeout(
        () => {
            scene.remove(flash);
        },
        45
    );
}


// ============================================================
// BULLET IMPACT
// ============================================================

function createImpact(
    position
) {

    const geometry =
        new THREE.SphereGeometry(
            0.08,
            8,
            8
        );


    const material =
        new THREE.MeshBasicMaterial({
            color: 0xffaa00
        });


    const impact =
        new THREE.Mesh(
            geometry,
            material
        );


    impact.position.copy(
        position
    );


    scene.add(impact);


    setTimeout(
        () => {
            scene.remove(impact);
        },
        120
    );
}


// ============================================================
// RESIZE
// ============================================================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


// ============================================================
// GAME LOOP
// ============================================================

function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            0.05
        );


    if (
        controls.isLocked
    ) {

        updatePlayer(
            delta
        );

    }


    renderer.render(
        scene,
        camera
    );
}


animate();

</script>

</body>
</html>
